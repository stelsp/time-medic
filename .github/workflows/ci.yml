name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: test -z "$(gofmt -l cmd/)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
